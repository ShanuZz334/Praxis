<!doctype html>
<!--
  @file index.html
  @purpose Main HTML entry point for the Praxis application.
  @responsibilities
  - Defines the root HTML structure for the React application.
  - Includes meta tags for SEO and viewport configuration.
  - Loads external icon library (Boxicons).
  - Provides mount points for React root and modal portals.
  - Loads the main JavaScript entry point (main.jsx).
  @dependencies
  - Boxicons (external CDN)
  - /src/app/main.jsx (React entry point)
  @lifecycle
  - Loaded by the browser as the initial HTML document.
  - React mounts to #root, modals render to #modal-root.
  @date 2026-02-04
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/praxis-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <title>Praxis</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="modal-root"></div>

    <script type="module" src="/src/app/main.jsx"></script>
  </body>
</html>
